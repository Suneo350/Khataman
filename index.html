<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12306b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Khataman">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Bani Abdul Hamid Mengaji</title>
<style>
:root{--pg:#fff;--bg:#eef3fa;--card:#fff;--tx:#10213a;--mut:#58687f;--em:#1e3a8a;--em2:#2f5fb8;--gold:#93b4e8;--gl:#e3ecfa;--ln:#cfdbee;--ok:#e3ecfa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#0c1524;--bg:#0c1524;--card:#14233b;--tx:#e8eefa;--mut:#9fb0cc;--em:#7aa7f0;--em2:#5b8fe0;--gl:#1d2f4f;--ln:#26395a;--ok:#1d2f4f}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--pg);color:var(--tx);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:640px;margin:0 auto;padding-bottom:40px}
header{background:#12306b;color:#fff;padding:16px 12px 14px;margin:10px 20px;border-radius:14px}
header h1{margin:0;font-size:20px;text-align:center;letter-spacing:.5px;color:#cfe0fa}
header p{margin:2px 0 12px;text-align:center;font-size:14px;opacity:.9}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g label{font-size:12px;opacity:.85;display:block}
.g input{width:100%;height:35px;font:inherit;font-size:16px;padding:0 10px;border-radius:8px;border:2px solid transparent;background:rgba(255,255,255,.96);color:#10213a}
.g input:focus{outline:none;border-color:var(--gold)}
.pg{margin-top:12px;font-weight:700}
.bar{height:14px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e6c34a,#f5e08a);transition:width .3s}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 6px}
.tools input[type=search]{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--ln);background:var(--card);color:var(--tx)}
.tools input:focus{outline:none;border-color:var(--em2)}
.fl{display:flex;gap:6px;margin-top:8px}
.fl button{flex:1;font:inherit;font-size:15px;font-weight:600;padding:10px 4px;border-radius:12px;border:2px solid var(--ln);background:var(--card);color:var(--tx)}
.fl button.on{background:var(--em);color:#fff;border-color:var(--em)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fl button.on{color:#06281c}}
#list{margin:10px 20px;padding:4px 10px;background:var(--gl);border:0;border-radius:14px}
.row{display:flex;align-items:center;gap:8px;height:35px;background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:0 10px;margin:5px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.row.d{background:var(--ok);border-color:var(--em2)}
.jz{min-width:30px;font-weight:700;color:var(--em)}
.ok{width:26px;text-align:center;font-size:18px}
.nm{flex:1;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed{border:0;background:none;font-size:16px;padding:0 6px;height:40px;color:var(--mut)}
.sec{margin:10px 20px;padding:6px 10px;background:var(--gl);border:1px solid var(--ln);border-radius:14px}
.btn{font:inherit;font-size:16px;font-weight:700;border:0;border-radius:8px;height:35px;padding:0 10px;width:100%;margin:5px 0;background:#1e3a8a;color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#fff}}
.btn.gd{background:#2f5fb8;color:#fff}
.btn.ot{background:#4673c2;color:#fff;border:0}
.btn.rd{background:#b91c1c;color:#fff}
.sm{display:flex;gap:6px}.sm .btn{font-size:14px;padding:10px 4px}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.mdl.on{display:flex}
.box{background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.box h3{margin:0 0 10px;color:var(--em)}
.box textarea,.box input[type=text]{width:100%;font:inherit;padding:10px;border-radius:12px;border:2px solid var(--ln);background:var(--bg);color:var(--tx)}
.box textarea{min-height:200px}
.ic{display:flex;gap:8px;margin:8px 0}
.ic button{flex:1;font:inherit;font-size:22px;padding:8px;border-radius:12px;border:2px solid var(--ln);background:var(--card);color:var(--tx)}
.ic button.on{border-color:var(--gold);background:var(--gl)}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#12306b;color:#fff;padding:12px 18px;border-radius:14px;display:none;z-index:30;border:2px solid var(--gold)}
.hint{color:var(--mut);font-size:14px;margin:0 0 8px}
</style>
</head>
<body>
<header>
<h1>BANI ABDUL HAMID MENGAJI</h1>
<p>Jadwal Khataman Al-Qur’an</p>
<div class="g">
<div><label>Khataman ke</label><input id="no" type="number" inputmode="numeric"></div>
<div><label>Jam</label><input id="jam" type="text"></div>
<div><label>Tanggal Mulai</label><input id="st" type="text"></div>
<div><label>Tanggal Selesai</label><input id="en" type="text"></div>
</div>
</header>

<div id="list"></div>

<div class="sec">
<button class="btn gd" data-a="copy">📋 Salin Teks WhatsApp</button>
<button class="btn" data-a="next">▶ Mulai Khataman Berikutnya</button>
<button class="btn ot" data-a="undo">↩ Undo Sesi Terakhir</button>
<button class="btn ot" data-a="add">➕ Tambah Peserta</button>
<button class="btn ot" data-a="foot">✏️ Edit Bagian Penutup Teks</button>
<input type="file" id="fi" accept=".json,application/json" hidden>
</div>

<div class="mdl" id="md"><div class="box" id="bx"></div></div>
<div id="toast"></div>

<script>
var K='khataman_bah_v1',F='🧕🏻',M='👳🏻‍♂️';
var RAW="F|Ida Lutfi Ams;M|Om Muttaqin Jahri;F|Bulik Amaronah Jahri;F|Bulik Yuliana Hudri;M|Ali Amsori;F|Rina Amsori;F|Ima Amsori;F|Ari Arifin;F|Mildana Arifin;M|Burhanudin;F|Yuliani;M|Panggih;F|Bulik Rofiqoh Jahri;M|Yayat Mustofa;F|Minha Mustofa;F|Wiwik Arifin;M|Om Rifa'i Sidiq;F|Ainun Rifa'i;M|Aziz K.Rifai;F|Ayya Burhan;F|Asma Nabillah;F|Bulik Rohimah Sidiq;M|Pakde Amsori Sidiq;M|Pakde Arifin Sidiq;F|Bulik Wasiati;M|Om Mustofa Sidiq;M|Fahri Rizal;F|Bulik Zuraida;F|Bulik Mukhiroh Sidiq;F|Bulik Harsih Sidiq";
var HEAD="بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ\nالسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللّٰهِ وَبَرَكَاتُهُ....\n\n*BANI ABDUL HAMID MENGAJI*\n\n";
var FOOT="🌳🌳🌳🌳🌳🌳\n*TILAWAH AL'QURAN JUS*\n0️⃣1️⃣ - 3️⃣0️⃣\n\nاللهم ارحمنا بالقرآن.. واجعله لنا إماما ونورا وهدى ورحمة.. اللهم ذكرنا منه ما نسينا وعلمنا منه ما جهلنا.. وارزقنا تلاوته آناء الليل وأطراف النهار.. واجعله لنا حجة يارب العالمين..\n\n\"Untuk peserta yg sekiranya ada halangan, dan tdk dapat menyelesaikan tugasnya, Bisa kasih tau ke ADMIN. Nanti bisa di bantu anggota lain untuk di Badalkan\"...\n\n*Untuk keseragaman tanda (Kholas) bisa gunakan lambang ini*\n✅\n*SELAMAT BERTADARUS*\n\n👳🏻‍♂️🧕🏻🌱🤲🏻🤲🏻🙏🏻";
function fresh(){var n=RAW.split(';').map(function(s){var p=s.split('|');return{i:p[0]=='F'?F:M,n:p[1]}});return{no:201,st:'25/5/2026',en:'2/6/2026',jam:'19:00',names:n,done:n.map(function(){return false}),foot:FOOT,prev:null}}
var S=fresh(),flt='all';
try{var l=JSON.parse(localStorage.getItem(K));if(l&&Array.isArray(l.names)&&l.names.length){S=Object.assign(S,l)}}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},2200)}
function fix(){while(S.done.length<S.names.length)S.done.push(false);S.done.length=S.names.length}
function render(){
fix();var N=S.names.length,c=S.done.filter(Boolean).length;
var h='';S.names.forEach(function(p,k){var d=S.done[k];
h+='<div class="row" data-k="'+k+'"><div class="jz">'+(k+1)+'.</div><div class="nm">'+p.i+' '+esc(p.n)+'</div></div>'});
$('list').innerHTML=h||'<p class="hint" style="text-align:center;padding:20px">Tidak ada data yang cocok.</p>';
$('no').value=S.no;$('st').value=S.st;$('en').value=S.en;$('jam').value=S.jam}
function mark(k){return ''}
function waText(){var t=HEAD+'Khataman ke : '+S.no+'\nMulai : '+S.st+'\nSampai: '+S.en+'\nJam: '+S.jam+'\n-----------------------\n';
S.names.forEach(function(p,k){t+=(k+1)+'. '+p.i+' '+p.n+mark(k)+'\n'});return t+'\n'+S.foot}
function modal(h){$('bx').innerHTML=h;$('md').classList.add('on')}
function closeM(){$('md').classList.remove('on')}
function confirmBox(title,msg,cb,label){modal('<h3>'+title+'</h3><p>'+msg+'</p><button class="btn" id="yes">'+(label||'Ya, lanjutkan')+'</button><button class="btn ot" data-x>Batal</button>');$('yes').onclick=function(){closeM();cb()}}
function editBox(k){var n=k<0,p=n?{i:F,n:''}:S.names[k],ic=p.i;
modal('<h3>'+(n?'Tambah Peserta':'Edit Peserta (Juz '+(k+1)+')')+'</h3><div class="ic"><button data-i="'+F+'" class="'+(ic==F?'on':'')+'">'+F+'</button><button data-i="'+M+'" class="'+(ic==M?'on':'')+'">'+M+'</button></div><input type="text" id="en2" placeholder="Nama peserta" value="'+esc(p.n)+'"><button class="btn" id="sv">Simpan</button>'+(n?'':'<div class="sm"><button class="btn ot" id="up">⬆ Naik</button><button class="btn ot" id="dn">⬇ Turun</button><button class="btn rd" id="rm">Hapus</button></div>')+'<button class="btn ot" data-x>Tutup</button>');
var bx=$('bx');bx.querySelectorAll('[data-i]').forEach(function(b){b.onclick=function(){ic=b.dataset.i;bx.querySelectorAll('[data-i]').forEach(function(o){o.classList.toggle('on',o===b)})}});
$('sv').onclick=function(){var v=$('en2').value.trim();if(!v){toast('Nama belum diisi');return}
if(n){S.names.push({i:ic,n:v});S.done.push(false)}else{S.names[k]={i:ic,n:v}}save();closeM();render()};
if(!n){var mv=function(d){var t=k+d;if(t<0||t>=S.names.length)return;[S.names[k],S.names[t]]=[S.names[t],S.names[k]];[S.done[k],S.done[t]]=[S.done[t],S.done[k]];save();closeM();render()};
$('up').onclick=function(){mv(-1)};$('dn').onclick=function(){mv(1)};
$('rm').onclick=function(){if(S.names.length<2)return;confirmBox('Hapus peserta?',esc(p.n)+' akan dihapus dari daftar.',function(){S.names.splice(k,1);S.done.splice(k,1);save();render()},'Hapus')}}}
function legacy(t){var a=document.createElement('textarea'),r=false;a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(a);a.focus();a.select();a.setSelectionRange(0,t.length);try{r=document.execCommand('copy')}catch(e){}a.remove();return r}
function copyTxt(t){return new Promise(function(ok,no){if(legacy(t)){ok();return}
if(navigator.clipboard){navigator.clipboard.writeText(t).then(ok,no)}else no()})}
function pasteBox(){modal('<h3>Tempel &amp; Baca Teks Grup</h3><p class="hint">Tempel rekap dari grup WA. Baris bernomor yang berakhir dengan emoji/tanda apa pun akan dicentang.</p><textarea id="pt2" placeholder="Tempel di sini…"></textarea><button class="btn" id="go">Baca &amp; Centang</button><button class="btn ot" data-x>Batal</button>');
$('go').onclick=function(){var cnt=0,seen=0,done=S.names.map(function(){return false});
$('pt2').value.split(/\r?\n/).forEach(function(ln){var m=ln.match(/^\s*(\d{1,2})\s*[.)]\s*(.*)$/);if(!m)return;var k=+m[1]-1;if(k<0||k>=done.length)return;seen++;
if(/[\p{Extended_Pictographic}\u2705\u2714\u2611][\uFE0F\u200D\u{1F3FB}-\u{1F3FF}]*\s*$/u.test(m[2])){done[k]=true;cnt++}});
if(!seen){toast('Tidak ada baris bernomor ditemukan');return}
S.done=done;save();closeM();render();toast(cnt+' baris dicentang')}}
function footBox(){modal('<h3>Bagian Penutup Teks</h3><textarea id="ft" style="min-height:300px">'+esc(S.foot)+'</textarea><button class="btn" id="sv">Simpan</button><button class="btn ot" id="rs">Kembalikan ke Awal</button><button class="btn ot" data-x>Batal</button>');
$('sv').onclick=function(){S.foot=$('ft').value;save();closeM();toast('Tersimpan')};$('rs').onclick=function(){$('ft').value=FOOT}}
function act(a){
if(a=='copy')copyTxt(waText()).then(function(){toast('Teks WhatsApp disalin ✅')},function(){toast('Gagal menyalin, coba tekan sekali lagi')});
else if(a=='next')confirmBox('Mulai Khataman Berikutnya?','Nomor khataman menjadi '+(S.no+1)+', nama peserta bergeser satu posisi ke bawah (nama terakhir naik ke posisi 1), dan semua centang direset.',function(){
S.prev={no:S.no,names:S.names.slice(),done:S.done.slice()};S.no=(+S.no||0)+1;S.names.unshift(S.names.pop());S.done=S.names.map(function(){return false});save();render();toast('Khataman '+S.no+' dimulai')});
else if(a=='undo'){if(!S.prev){toast('Belum ada sesi untuk di-undo');return}
confirmBox('Undo Sesi Terakhir?','Kembali ke Khataman '+S.prev.no+' beserta urutan nama dan centangnya.',function(){S.no=S.prev.no;S.names=S.prev.names;S.done=S.prev.done;S.prev=null;save();render();toast('Sesi dikembalikan')},'Ya, kembalikan')}
else if(a=='add')editBox(-1);else if(a=='foot')footBox();
else if(a=='clr')confirmBox('Reset semua centang?','Semua status akan menjadi belum selesai.',function(){S.done=S.names.map(function(){return false});save();render()});
else if(a=='exp'){var b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='khataman-'+S.no+'.json';document.body.appendChild(l);l.click();l.remove();toast('Mengunduh cadangan…')}
else if(a=='imp')$('fi').click()}
document.addEventListener('click',function(e){var t=e.target.closest('button,.mdl');if(!t){var r=e.target.closest('.row');if(r)editBox(+r.dataset.k);return}
if(t.id=='md'&&e.target===t){closeM();return}
if(t.hasAttribute('data-x')){closeM();return}
if(t.dataset.a)act(t.dataset.a);
else if(t.dataset.c!==undefined){var k=+t.dataset.c;S.done[k]=!S.done[k];save();render()}
else if(t.dataset.e!==undefined)editBox(+t.dataset.e);
else if(t.dataset.f){flt=t.dataset.f;render()}});
$('fi').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!Array.isArray(d.names)||!d.names.length)throw 0;
confirmBox('Import data?','Data saat ini akan diganti dengan isi file cadangan.',function(){S=Object.assign(fresh(),d);fix();save();render();toast('Import berhasil')})}catch(e){toast('File tidak valid')}};r.readAsText(f);this.value=''};
[['no','no'],['st','st'],['en','en'],['jam','jam']].forEach(function(p){$(p[0]).oninput=function(){S[p[1]]=p[0]=='no'?(parseInt(this.value)||0):this.value;save()}});
render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
